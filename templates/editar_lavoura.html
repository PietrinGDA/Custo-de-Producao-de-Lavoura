
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Editar Lavoura</title>
</head>
<body>
    <h1>Editar Lavoura</h1>

    <form method="POST">
        <label for="nome">Nome da lavoura:</label>
        <input
            type="text"
            id="nome"
            name="nome"
            value="{{ lavoura.nome }}"
            required
        >

        <br><br>

        <label for="cultura">Cultura:</label>
        <input
            type="text"
            id="cultura"
            name="cultura"
            value="{{ lavoura.cultura }}"
            required
        >

        <br><br>

        <label for="ano">Ano:</label>
        <input
            type="number"
            id="ano"
            name="ano"
            value="{{ lavoura.ano }}"
            required
        >

        <br><br>

        <button type="submit">Salvar alterações</button>
    </form>

    <p><a href="{{ url_for('inicio') }}">Voltar para lavouras</a></p>
</body>
</html>
