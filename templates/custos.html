<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Cadastro de Custos</title>
</head>
<body>
    <h1>Cadastro de Custos</h1>

    <form>
        <label for="lavoura">Lavoura:</label>
        <input type="text" id="lavoura" name="lavoura" required>

        <label for="descricao">Descrição do custo:</label>
        <input type="text" id="descricao" name="descricao" required>

        <label for="categoria">Categoria:</label>
        <input type="text" id="categoria" name="categoria" required>

        <label for="valor">Valor (R$):</label>
        <input type="number" id="valor" name="valor" step="0.01" required>

        <label for="data">Data do custo:</label>
        <input type="date" id="data" name="data" required>

        <br>

        <button type="submit">Cadastrar Custo</button>
    </form>
</body>
</html>
