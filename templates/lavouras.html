<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Cadastro de Lavouras</title>
</head>
<body>
    <h1>Cadastro de Lavouras</h1>

    <form method="POST" action="{{ url_for('inicio') }}">
        <label for="nome">Nome da lavoura:</label>
        <input type="text" id="nome" name="nome" required>

        <br><br>

        <label for="cultura">Cultura:</label>
        <input type="text" id="cultura" name="cultura" required>

        <br><br>

        <label for="ano">Ano:</label>
        <input type="number" id="ano" name="ano" required>

        <br><br>

        <button type="submit">Cadastrar Lavoura</button>
    </form>
        <hr>

    <h2>Lavouras cadastradas</h2>

    {% if lavouras %}
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Cultura</th>
                    <th>Ano</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for lavoura in lavouras %}
                    <tr>
                        <td>{{ lavoura.nome }}</td>
                        <td>{{ lavoura.cultura }}</td>
                        <td>{{ lavoura.ano }}</td>
                        <td>
                            <a href="{{ url_for('editar_lavoura', id=lavoura.id) }}">Editar</a>

                            <form method="POST"
                                action="{{ url_for('excluir_lavoura', id=lavoura.id) }}"
                                onsubmit="return confirm('Tem certeza de que deseja excluir esta lavoura?');"
                                style="display: inline;">
                                <button type="submit">Excluir</button>
                            </form>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>Nenhuma lavoura cadastrada ainda.</p>
    {% endif %}
</body>
</html>
